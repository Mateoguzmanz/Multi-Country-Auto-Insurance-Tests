<div class="confirm-dialog" (click)="onBackdropClick()">
  <div
    class="confirm-dialog__panel"
    role="alertdialog"
    aria-modal="true"
    aria-describedby="confirm-dialog-message"
    (click)="$event.stopPropagation()"
    (keydown.escape)="cancelled.emit()"
  >
    <p id="confirm-dialog-message" class="confirm-dialog__message">{{ message() }}</p>
    <div class="confirm-dialog__actions">
      <button #cancelButton type="button" class="confirm-dialog__cancel" (click)="cancelled.emit()">
        {{ t('cancel') }}
      </button>
      <button type="button" class="confirm-dialog__confirm" (click)="confirmed.emit()">
        {{ t('confirm') }}
      </button>
    </div>
  </div>
</div>
